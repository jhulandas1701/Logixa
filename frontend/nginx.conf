server {
    listen 80;
    server_name _;

    # Match the Go ingestor's own cap (MAX_REQUEST_SIZE_GB=5) so large batch
    # uploads aren't rejected by nginx before they even reach go-ingestor.
    client_max_body_size 5120m;

    root /usr/share/nginx/html;
    index index.html;

    # Static app shell
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Go ingestion service (raw upload, MinIO storage, ingestion state) ---
    location /go/ {
        proxy_pass http://go-ingestor:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --- Python processing pipeline (jobs, events, profiles, stats) ---
    location /pipeline/ {
        proxy_pass http://python-pipeline:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    # --- MinIO liveness, used only for the header status dot ---
    location = /minio-health {
        proxy_pass http://minio:9000/minio/health/live;
        proxy_set_header Host $host;
    }
}
