services:
  minio:
    image: minio/minio:latest
    container_name: logixa-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
  python-pipeline:
    build: ./python-pipeline
    container_name: logixa-python
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: logixa-raw
      MINIO_SECURE: "false"
      WORKERS: "4"
    ports:
      - "8000:8000"
    volumes:
      - pipeline_data:/data
    depends_on:
      minio:
        condition: service_started

  go-ingestor:
    build: ./go-ingestor
    container_name: logixa-go
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: logixa-raw
      MINIO_SECURE: "false"
      PIPELINE_URL: http://python-pipeline:8000
      MAX_FILE_SIZE_MB: "500"
      MAX_REQUEST_SIZE_GB: "5"
    ports:
      - "8080:8080"
    depends_on:
      minio:
        condition: service_started
      python-pipeline:
        condition: service_started

  frontend:
    build: ./frontend
    container_name: logixa-frontend
    ports:
      - "3000:80"
    depends_on:
      minio:
        condition: service_started
      python-pipeline:
        condition: service_started
      go-ingestor:
        condition: service_started

volumes:
  minio_data:
  pipeline_data:
